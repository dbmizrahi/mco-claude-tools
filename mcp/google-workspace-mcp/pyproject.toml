[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-workspace-mcp"
version = "0.2.0"
description = "MCP server for Google Workspace (Gmail, Calendar, Drive, Docs, Sheets, Slides, Chat): one Google account per server, signed in with an OAuth refresh token"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "dbmizrahi" }]
keywords = ["google-workspace", "gmail", "google-calendar", "google-drive", "mcp", "model-context-protocol"]
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
    "pydantic>=2",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
google-workspace-mcp = "google_workspace_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/google_workspace_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [".gitignore", ".dockerignore", "Dockerfile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
